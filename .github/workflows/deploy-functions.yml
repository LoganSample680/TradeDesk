name: Deploy Supabase Edge Functions

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        # --include-all: a migration was renamed to an earlier date (20260610→20260609),
        # so it now sorts before the last migration already on remote. Supabase refuses
        # to apply an out-of-order migration without this flag. All migrations are
        # idempotent (add column if not exists / drop policy if exists + create), so
        # applying the missing ones in version order is safe and ends in the secure state.
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy edge functions
        # functions deploy takes --project-ref, NOT --linked (only db push uses the
        # linked project). Mixing them up made this step fail after db push succeeded.
        run: |
          supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync Stripe webhook subscribed events
        # Owner ask (2026-08-19): keep the webhook endpoint's event list in code, not
        # clicked together by hand in the Stripe Dashboard. scripts/sync-stripe-webhooks.js
        # parses the required list straight out of stripe-webhook/index.ts's own
        # `event.type === '...'` checks (so it can never drift), then makes the live
        # Stripe endpoint match exactly. Idempotent — a no-op run just says so.
        #
        # TEST mode always runs (STRIPE_TEST_SECRET_KEY already exists as a repo
        # secret). LIVE mode runs only once STRIPE_LIVE_RESTRICTED_KEY_WEBHOOKS has
        # been added (a Stripe restricted key scoped to Webhook Endpoints read/write
        # only) — the script logs a clear skip line and exits 0 for that mode until then,
        # it never fails the deploy over a secret that hasn't been added yet.
        run: |
          npm install --no-save stripe@14
          node scripts/sync-stripe-webhooks.js
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_LIVE_RESTRICTED_KEY_WEBHOOKS: ${{ secrets.STRIPE_LIVE_RESTRICTED_KEY_WEBHOOKS }}
