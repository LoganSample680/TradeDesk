name: E2E Tests

on:
  # Only run on PRs (covers every commit pushed to the feature branch while
  # the PR is open). The pull_request event does NOT double-fire alongside
  # the push event, so we get exactly 1 run per commit — not 2.
  pull_request:
    branches: ['**']
  # Also run on direct pushes to main (post-merge validation).
  push:
    branches: [main]
  # Full-suite backstop, ~11pm US Central nightly (owner ask 2026-08-20: CI
  # was taking too long on every push). GitHub Actions cron is UTC-only and
  # can't express "US Central" directly, 04:00 UTC matches 11pm CDT (the
  # ~8 months/year DST covers); during CST (~Nov-Mar) this drifts to ~10pm
  # Central. Accepted rather than running two cron entries for a 1-hour
  # seasonal drift nobody will notice on a nightly job.
  schedule:
    - cron: '0 4 * * *'

# Cancel any in-progress run for the same branch/PR when a new commit is
# pushed. Prevents stale jobs stacking up while you iterate.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Migration lint ──────────────────────────────────────────────────────────
  # Validates every SQL migration file on every PR — never skips, no Supabase
  # bot dependency. Catches syntax errors and type mismatches before merge.
  migration-lint:
    name: Migration lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Start local Postgres
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER testuser WITH SUPERUSER PASSWORD 'testpass';"
          sudo -u postgres psql -c "CREATE DATABASE testdb OWNER testuser;"

      - name: Run all migrations against local Postgres
        env:
          PGPASSWORD: testpass
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "▶ applying $f"
            psql -h localhost -U testuser -d testdb -f "$f" || exit 1
          done
          echo "✅ All migrations applied cleanly"

  # ── §12.8 flow-test coverage advisory ───────────────────────────────────────
  # CLAUDE.md §12.8 requires a live flow test (tests/flow/*.spec.js) for every
  # feature/change that touches a real user flow, but until now that rule
  # lived only in memory: nothing in the pipeline flagged a PR that shipped
  # without one, and features have shipped that way. This job makes the gap
  # VISIBLE on the PR instead of silently forgotten.
  #
  # Deliberately non-blocking: it only ever emits a ::warning:: annotation,
  # never a non-zero exit. A hard-failing check here would false-positive on
  # small bug fixes already covered by existing tests (not every touch of
  # dashboard.js is a new feature), and a gate that cries wolf trains Claude
  # to route around it, which defeats the entire point of making this
  # visible. This is an FYI for the owner and Claude to glance at, not a
  # merge blocker.
  flow-test-advisory:
    name: "§12.8 flow-test advisory"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # PR-only: the "did this branch add a flow test" question only makes
    # sense relative to where it diverged from its base branch. A direct push
    # to main (post-merge) has already been through this check on its PR.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check feature-surface changes for a matching flow test
        # Belt-and-suspenders on top of the "advisory only" design above: if
        # git itself trips (fetch hiccup, unexpected merge-base shape) this
        # must still never fail the job, so continue-on-error backstops any
        # exit code this script could theoretically produce.
        continue-on-error: true
        run: |
          # actions/checkout only guarantees the PR head's own history is
          # local; fetch the base branch explicitly so `git merge-base`
          # below has something to diff against regardless of how deep the
          # PR branch is.
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          BASE=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)
          CHANGED=$(git diff --name-only "$BASE" HEAD)

          # Scoped to files that carry real feature/business-logic surface a
          # live flow test would actually exercise: not every js/*.js file.
          # Shared helpers (utils.js, data.js, constants.js, icons.js, lib/,
          # vendor/, cloud.js's low-level sync plumbing, etc.) have no
          # user-facing flow of their own and would just be noise here.
          FEATURE_FILES="js/dashboard.js js/mileage.js js/clients.js js/jobs.js js/bids.js js/finance.js js/geo-track.js js/proposals.js js/generic-estimate.js"

          TOUCHED=""
          for f in $FEATURE_FILES; do
            if echo "$CHANGED" | grep -qx "$f"; then
              TOUCHED="$TOUCHED $f"
            fi
          done

          if [ -z "$TOUCHED" ]; then
            echo "no feature-surface files changed on this branch, nothing to flag"
            exit 0
          fi

          if echo "$CHANGED" | grep -qE '^tests/flow/.*\.spec\.js$'; then
            echo "flow-test change found alongside the feature-surface change(s), ok:$TOUCHED"
            exit 0
          fi

          echo "::warning::CLAUDE.md §12.8 advisory: this branch changed$TOUCHED with no tests/flow/*.spec.js change anywhere since it diverged from ${{ github.event.pull_request.base.ref }}. §12.8 asks every user-facing feature or flow change to get a live flow test architected with the owner before it's called done. Advisory only, not a blocking check: if existing test coverage already handles this change, there is nothing to do."

  # ── §3.3 native plugin test coverage advisory ───────────────────────────────
  # Mirrors flow-test-advisory exactly, same non-blocking philosophy, for the
  # native side: every changed td-* plugin Swift file should ship adversarial
  # XCTest coverage (native/tests/*Tests.swift) in the same commit (§3.3).
  # ios-native-tests.yml already hard-gates that the suite COMPILES AND
  # PASSES; this job only flags when a plugin changed with no matching test
  # file touched anywhere in the diff, so a drive-by tweak doesn't get
  # silently unstressed. Advisory only for the same reason as §12.8's job: a
  # hard gate here would false-positive on small fixes already covered, and
  # teach Claude to route around it.
  native-test-advisory:
    name: "§3.3 native test advisory"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check plugin changes for a matching adversarial test
        continue-on-error: true
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          BASE=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)
          CHANGED=$(git diff --name-only "$BASE" HEAD)

          PLUGIN_CHANGES=$(echo "$CHANGED" | grep -E '^native/td-[^/]+/ios/Plugin/.*\.swift$' || true)

          if [ -z "$PLUGIN_CHANGES" ]; then
            echo "no native plugin Swift files changed on this branch, nothing to flag"
            exit 0
          fi

          if echo "$CHANGED" | grep -qE '^native/tests/.*Tests\.swift$'; then
            echo "native test change found alongside the plugin change(s), ok:"
            echo "$PLUGIN_CHANGES"
            exit 0
          fi

          FLAT=$(echo "$PLUGIN_CHANGES" | tr '\n' ' ')
          echo "::warning::CLAUDE.md §3.3 advisory: this branch changed $FLAT with no native/tests/*Tests.swift change anywhere since it diverged from ${{ github.event.pull_request.base.ref }}. §3.3 asks every new or changed plugin method to get adversarial XCTest coverage in the same commit. Advisory only, not a blocking check: if existing coverage already handles this change, there is nothing to do."

  # ── Test scope planner (owner ask 2026-08-20: CI was too slow on every push) ─
  # Decides, once, up front, what the `test` job below actually runs:
  #   - push to main / nightly schedule: ALWAYS the full 6-shard suite. main
  #     is the source of truth and the nightly run is the whole point of this
  #     change, both stay exactly as thorough as before.
  #   - a PR touching a "high-impact" shared file (tests/helpers.js, the kind
  #     of file §10.3 already calls "high-voltage infrastructure", plus
  #     js/cloud.js, js/utils.js, js/data.js, index.html, playwright.config.js):
  #     ALSO the full suite, immediately, not just at 11pm. A change here can
  #     break a spec file with no obvious name/file relationship to what
  #     changed (see tonight's two CI failures, both caused by a classifier
  #     change in js/cloud.js surfacing pre-existing gaps in unrelated spec
  #     files' mocks) — waiting for the nightly run to find that out, with
  #     more work possibly landing on top in the meantime, is exactly the
  #     house-of-cards scenario §10's Patch-Chain Prohibition exists to avoid.
  #   - any other PR: only the offline spec files that changed directly, plus
  #     any spec file whose name correlates with a changed js/*.js or *.html
  #     file (e2e-timelog.spec.js for js/timelog.js, etc, this repo's own
  #     naming convention, followed closely but not 100% of the time). This
  #     is a HEURISTIC, not exact blast-radius analysis, it's a fast lane
  #     backstopped by the high-impact-file rule above and the nightly full
  #     run, not a replacement for either.
  plan:
    name: Determine test scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.decide.outputs.run_full }}
      skip: ${{ steps.decide.outputs.skip }}
      extra_args: ${{ steps.decide.outputs.extra_args }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "push to main or the nightly backstop, running the full suite"
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "extra_args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin "${{ github.event.pull_request.base.ref }}"
          BASE=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files since $BASE:"
          echo "$CHANGED"

          HIGH_IMPACT='^(tests/helpers\.js|js/cloud\.js|js/utils\.js|js/data\.js|index\.html|playwright\.config\.js)$'
          if echo "$CHANGED" | grep -qE "$HIGH_IMPACT"; then
            echo "high-impact shared file changed, running the full suite now instead of waiting for the nightly run"
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "extra_args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Directly-changed/added spec files (excluding the live-Supabase
          # flow suite and the preview-smoke suite, neither of which the
          # offline `test` job below is configured to run).
          DIRECT=$(echo "$CHANGED" | grep -E '^tests/.*\.spec\.js$' | grep -vE '^tests/(flow|preview-smoke)/' || true)

          # Filename-correlated spec files: for every changed js/*.js or
          # *.html file, match any tests/*<basename>*.spec.js.
          CORRELATED=""
          for f in $(echo "$CHANGED" | grep -E '^(js/.*\.js|.*\.html)$' || true); do
            base=$(basename "$f" | sed -E 's/\.(js|html)$//')
            hits=$(ls tests/*"$base"*.spec.js 2>/dev/null || true)
            CORRELATED="$CORRELATED
          $hits"
          done

          ALL=$(printf '%s\n%s' "$DIRECT" "$CORRELATED" | grep -v '^[[:space:]]*$' | sed 's/^[[:space:]]*//' | sort -u)
          if [ -z "$ALL" ]; then
            echo "no relevant offline spec files for this diff, skipping the offline suite (nightly run still covers it)"
            echo "run_full=false" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "extra_args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FLAT=$(echo "$ALL" | tr '\n' ' ')
          echo "Fast-path spec files: $FLAT"
          echo "run_full=false" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "extra_args=$FLAT" >> "$GITHUB_OUTPUT"

  # ── E2E browser tests ───────────────────────────────────────────────────────
  test:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false   # let all shards finish so we see ALL failures
      matrix:
        shard: [1, 2, 3, 4, 5, 6]   # 6 shards — each handles 1/6 of tests

    # Opt into Node 24 for action runners (checkout, cache, upload-artifact).
    # GitHub drops Node 20 from runners on Jun 2 2026 — this gets ahead of it.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
        env:
          # GitHub Actions drops Node 20 for action runners on Jun 2 2026.
          # Opt into Node 24 now so the upgrade is on our schedule, not GitHub's.
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install Playwright 1.56
        # Pin to 1.56.0 — matches local dev setup and the browser revisions
        # already validated. Bump here when upgrading Playwright.
        run: npm install --no-save @playwright/test@1.56.0 serve

      # Cache browser binaries keyed to the Playwright version.
      # On cache hit the download (~500 MB) is skipped — saves ~60s per shard.
      # --with-deps still runs to ensure OS-level system libraries are present
      # (apt packages can't be cached), but the binaries are already on disk.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-1.56.0

      - name: Install Playwright browsers (WebKit + Chromium)
        run: npx playwright install --with-deps webkit chromium

      # extra_args is empty on a full run (push/schedule/high-impact PR),
      # unchanged from before this change; on a normal PR it's the fast-path
      # spec file list from the plan job above, so --shard still divides
      # exactly what's actually running 6 ways (some shards may see zero
      # matching tests when the list is short — a clean, fast, valid pass,
      # not a hang).
      - name: Run Playwright tests (shard ${{ matrix.shard }}/6)
        run: npx playwright test --shard=${{ matrix.shard }}/6 ${{ needs.plan.outputs.extra_args }}
        env:
          CI: true

      # Upload the full HTML report on EVERY run (pass or fail).
      # Each shard uploads its own report with a unique name.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      # Upload raw test results (traces, screenshots, videos) on failure.
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
