name: IndexNow (ask for a recrawl)

# A noindex only takes effect when the crawler comes back and reads it, and on
# its own schedule that is weeks. Until then the stale entry is what search
# returns and what every AI assistant repeats. This asks the participating
# engines to come back now: Bing (which is what ChatGPT's search reads), Yandex,
# Seznam, Naver. Google does not participate and still needs Search Console.
#
# Production only. A preview URL is not what anyone should be asked to index.
on:
  push:
    branches: [main]
    paths:
      - 'landing.html'
      - 'compare.html'
      - 'compare/**'
      - '*-contractor-software.html'
      - 'tools/**'
      - 'privacy.html'
      - 'terms.html'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'robots.txt'
      # The app and customer pages: a change to their noindex is exactly the
      # thing a recrawl needs to see.
      - 'index.html'
      - 'sign.html'
      - 'client.html'
      - 'intake.html'
      - 'contract-sign.html'
      - 'timesheet.html'
  workflow_dispatch: {}

# One submission at a time; a newer push supersedes an in-flight one.
concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    # MUST exceed the deploy wait below, whose ceiling is stated in
    # scripts/wait-for-deploy.js. The first run of this workflow was killed at
    # exactly 5m08s in the middle of waiting and the Submit step was SKIPPED,
    # so nothing reached Bing and the job reported "cancelled" rather than
    # failing. tests/e2e-indexnow-workflow.spec.js fails if they drift apart.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Cloudflare has to have published the new build before the crawlers are
      # invited to look at it, or they fetch the old one and this made things
      # worse rather than better.
      #
      # This used to poll the live site for its version.json and never once got
      # an answer (run 2, 2026-09-12: ten minutes of "serving '?'" on a deploy
      # that had already gone out). Cloudflare answers a plain curl with a bot
      # challenge. The waiter asks GitHub for the deployment status instead,
      # which is the same signal preview-smoke.yml already triggers on.
      - name: Wait for Cloudflare to publish this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-deploy.js

      - name: Submit
        run: node scripts/indexnow.js
