# ── ONCE A DAY: WHAT IS ON UAT AND NOT IN PRODUCTION (owner 2026-10-01) ─────
#
# "ensure everything makes it to main." A roll puts a branch on the phones and
# nothing ever says its PR did not merge. This keeps one issue, "On UAT, not in
# production", rewritten every morning by scripts/uat-backlog.js: every branch
# with work on uat and not on main, how old it is, and its PR (or that it has
# none). Anything two days old or more is flagged. When nothing is waiting the
# issue is closed, and it reopens the next time something is.
name: UAT backlog

on:
  schedule:
    - cron: '47 12 * * *'   # 7:47am CDT
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Write the report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          node scripts/uat-backlog.js > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' >> report.md
          cat report.md
      - name: Update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="On UAT, not in production"
          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          num=$(api "https://api.github.com/repos/$REPO/issues?state=all&per_page=100&creator=github-actions%5Bbot%5D" \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t and (.pull_request | not))][0].number // empty')
          waiting=$(grep -c '^- `' report.md || true)
          state=$([ "$waiting" -gt 0 ] && echo open || echo closed)
          body=$(jq -n --rawfile b report.md --arg t "$TITLE" --arg s "$state" '{title:$t, body:$b, state:$s}')
          if [ -n "$num" ]; then
            api -X PATCH "https://api.github.com/repos/$REPO/issues/$num" -d "$body" >/dev/null
          elif [ "$waiting" -gt 0 ]; then
            api -X POST "https://api.github.com/repos/$REPO/issues" -d "$(jq 'del(.state)' <<< "$body")" >/dev/null
          fi
          echo "$waiting branch(es) waiting; issue $state."
