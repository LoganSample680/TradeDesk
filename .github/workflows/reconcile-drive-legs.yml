# Nightly drive-leg reconciliation: safety net for the live client-side geo
# tracker (js/geo-track.js). The live engine derives drive legs from fence
# crossings observed in real time on the device; a killed app, a cold local
# geocode cache, or a missed ping can mean a real drive never gets logged
# (owner report 2026-08-19: two legs around a same-day client visit never
# showed up). This replays each account's raw location_pings from the day
# that just closed through the reconcile-drive-legs edge function, which
# backfills the TIME (never a guessed destination/mileage) for any sustained
# movement with no matching job_time_entries row. Idempotent: safe to
# re-run, and it can never duplicate what the live client already logged.
#
# RECONCILE_SHARED_SECRET (repo secret, optional): the function writes
# payroll-relevant rows, unlike the read-only analytics rollup, so it checks
# this header if the matching function secret is set (`supabase secrets set
# RECONCILE_SHARED_SECRET=...`). Until both sides are set the function still
# runs open, same graceful-degradation shape as the Stripe webhook sync step
# in deploy-functions.yml.
name: Reconcile Drive Legs

on:
  schedule:
    - cron: '0 9 * * *'   # nightly 09:00 UTC (roughly 3-4am Central), an hour behind the analytics rollup
  workflow_dispatch:
    inputs:
      day:
        description: 'Specific day to reconcile (YYYY-MM-DD), defaults to yesterday'
        required: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke reconcile-drive-legs
        env:
          RECONCILE_SHARED_SECRET: ${{ secrets.RECONCILE_SHARED_SECRET }}
        run: |
          day="${{ github.event.inputs.day }}"
          url="https://mwtsmctajhrrybblgorf.supabase.co/functions/v1/reconcile-drive-legs"
          [ -n "$day" ] && url="$url?day=$day"
          resp=$(curl -sS -X POST -H "x-recon-secret: $RECONCILE_SHARED_SECRET" -w '\n%{http_code}' "$url")
          body=$(echo "$resp" | head -n -1); code=$(echo "$resp" | tail -1)
          echo "HTTP $code, response: $body"
          [ "$code" = "200" ] || { echo "::error::reconcile-drive-legs failed"; exit 1; }
