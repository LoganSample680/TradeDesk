# ── KEEP EVERY OPEN PR MERGEABLE WHEN MAIN MOVES (owner 2026-10-01) ─────────
#
# "how do we write in multiple sessions but ensure everything makes it to
# main."
#
# Every commit stamps the same version lines, so one merge to main leaves
# every other open PR conflicted and GitHub will not merge it. This merges
# main into each open claude/* PR, settles the stamp with the same resolver
# the uat roll uses (scripts/lib/stamp-merge.sh), and pushes. A conflict in
# real code is never resolved here: the PR gets one comment naming the files.
#
# The push uses GH_DISPATCH_TOKEN because a push made with GITHUB_TOKEN does
# not start the PR's tests, and a PR whose tests never ran cannot merge. If
# that token cannot push, the step says so and the branch is left alone.
name: PR sync

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pr-sync
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_DISPATCH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Merge main into each open PR
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_PAT: ${{ secrets.GH_DISPATCH_TOKEN != '' }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          git config user.name "tradedesk-sync"
          git config user.email "sync@tradedesk.invalid"
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::GH_DISPATCH_TOKEN is not set, so a synced branch would not start its tests. Nothing pushed."
            exit 0
          fi
          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          # Open PRs into main from this repo's claude/* branches, touched in
          # the last 7 days. An abandoned PR is not worth a CI round a day.
          since=$(date -u -d '7 days ago' +%s)
          api "https://api.github.com/repos/$REPO/pulls?state=open&base=main&per_page=100" \
            | jq -r --argjson since "$since" --arg repo "$REPO" '.[]
                | select(.head.repo.full_name == $repo)
                | select(.head.ref | startswith("claude/"))
                | select((.updated_at | fromdateiso8601) >= $since)
                | "\(.number) \(.head.ref)"' > prs.txt
          [ -s prs.txt ] || { echo "No open PRs to sync."; exit 0; }
          # Run the sync from a copy: each PR's checkout swaps the scripts
          # directory for that branch's own, which may be older than this one.
          TOOLS="$(mktemp -d)"; cp -r scripts "$TOOLS/"
          while read -r num ref; do
            echo "::group::#$num $ref"
            # `|| rc=$?`, not `; rc=$?`: the step's shell exits on the first
            # failing command, so a PR that could not sync used to end the
            # whole run with its reason unprinted (2026-10-02, #146).
            rc=0
            out=$(bash "$TOOLS/scripts/pr-sync.sh" "$ref" --push --only-if-conflicted 2>&1) || rc=$?
            echo "$out"
            echo "::endgroup::"
            if [ "$rc" = "2" ]; then
              # One comment per PR per set of files, not one per main merge.
              files=$(printf '%s\n' "$out" | sed -n 's/^    //p' | sort | tr '\n' ' ')
              marker="<!-- pr-sync: $files-->"
              if ! api "https://api.github.com/repos/$REPO/issues/$num/comments?per_page=100" | jq -r '.[].body' | grep -qF "$marker"; then
                body=$(jq -n --arg b "$marker
          main moved and this PR now conflicts with it in real code, not just the version stamp:

          $(printf '%s\n' "$out" | sed -n 's/^    /- /p')

          Merge main into the branch and resolve these by hand (\`bash scripts/pr-sync.sh $ref\` does the stamp part).

          ---
          _Generated by [Claude Code](https://claude.ai/code)_" '{body:$b}')
                api -X POST "https://api.github.com/repos/$REPO/issues/$num/comments" -d "$body" >/dev/null
              fi
            elif [ "$rc" != "0" ]; then
              echo "::warning::#$num ($ref) could not be synced: $(printf '%s' "$out" | tail -1)"
            fi
          done < prs.txt
