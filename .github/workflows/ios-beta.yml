# TradeDesk Beta -> TestFlight
#
# Builds the Capacitor shell (native/) on GitHub's free macOS runner and
# uploads it to TestFlight. No Mac required anywhere: signing uses Xcode's
# cloud-managed automatic signing driven by an App Store Connect API key.
#
# Manual trigger only (workflow_dispatch): shell builds are rare and deliberate.
# Day-to-day app changes ship through the web deploy, the shell just loads the
# UAT URL (native/capacitor.config.json server.url) and never needs rebuilding
# for them.
#
# Required repo secrets:
#   APPSTORE_API_KEY     full contents of the .p8 App Store Connect API key
#   APPSTORE_KEY_ID      the key's Key ID
#   APPSTORE_ISSUER_ID   the account's Issuer ID
#   APPLE_TEAM_ID        the developer Team ID (developer.apple.com -> Membership)
name: iOS Beta (TestFlight)

on:
  workflow_dispatch:
  schedule:
    # TestFlight builds hard-expire after 90 days (Apple rule, no opt-out).
    # A fresh build on the 1st of every month keeps the beta permanently
    # alive with 2 months of margin; the internal group auto-distributes,
    # so testers just see an update, never an expiry.
    - cron: '0 9 1 * *'

jobs:
  build-upload:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor
        run: npm install

      - name: Generate the iOS project (fresh every build, nothing checked in)
        run: npx cap add ios

      - name: Sync config and plugins into the iOS project
        run: npx cap sync ios

      - name: Configure Info.plist (background location + consent copy)
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'TradeDesk logs your work drives and time on site for your business records.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'TradeDesk logs your work drives and time on site for your business records.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'Choose Always so drives and job-site time keep logging while your phone is in your pocket. Tracking follows your business-hours and consent settings.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription 'Choose Always so drives and job-site time keep logging while your phone is in your pocket. Tracking follows your business-hours and consent settings.'" "$PLIST"
          # TdScan (RoomPlan): ARKit uses the camera; missing this string crashes on scan start.
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'TradeDesk uses the camera and LiDAR to scan rooms into floor plans for your estimates.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'TradeDesk uses the camera and LiDAR to scan rooms into floor plans for your estimates.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMotionUsageDescription string 'TradeDesk reads the motion coprocessor to timestamp when a drive started and ended, so job time and mileage are accurate without running GPS all day.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSMotionUsageDescription 'TradeDesk reads the motion coprocessor to timestamp when a drive started and ended, so job time and mileage are accurate without running GPS all day.'" "$PLIST"
          # TdVoice: on-device dictation needs BOTH the mic and the speech
          # entitlement strings; a missing one is an instant crash on first press.
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'TradeDesk turns what you say into job notes, so you can record details without stopping work.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'TradeDesk turns what you say into job notes, so you can record details without stopping work.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Your voice notes are transcribed on this iPhone. The audio never leaves your device.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription 'Your voice notes are transcribed on this iPhone. The audio never leaves your device.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" "$PLIST" || true
          # Standard HTTPS only: answers TestFlight's export-compliance question
          # permanently so builds never sit in "Missing Compliance".
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST"

      - name: Sign in with Apple entitlement
        # Native Apple sign-in (ASAuthorization) requires the applesignin
        # entitlement on the App target. The entitlements file is written
        # fresh each build (nothing generated is checked in) and wired into
        # the App target's build settings via the bundle-id line, which only
        # the App target has, so Pods targets are never touched. Cloud
        # signing syncs the capability onto the provisioning profile.
        run: |
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.applesignin</key>
            <array><string>Default</string></array>
          </dict>
          </plist>
          EOF
          sed -i '' 's|PRODUCT_BUNDLE_IDENTIFIER = app.tradedesk.beta;|PRODUCT_BUNDLE_IDENTIFIER = app.tradedesk.beta;\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;|g' ios/App/App.xcodeproj/project.pbxproj
          grep -n "CODE_SIGN_ENTITLEMENTS" ios/App/App.xcodeproj/project.pbxproj

      - name: App icon from the repo's PWA icon
        # The generated project ships Capacitor's placeholder icon (owner:
        # "where's our TradeDesk logo?"). Refill every slot in the appiconset
        # from icons/icon-512.png at each slot's own size; the jpeg round-trip
        # flattens alpha, which App Store icons must not carry.
        run: |
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          ls "$ICONSET"
          sips -z 1024 1024 ../icons/icon-512.png --out /tmp/icon-rgba.png
          sips -s format jpeg /tmp/icon-rgba.png --out /tmp/icon-flat.jpg
          sips -s format png /tmp/icon-flat.jpg --out /tmp/icon-1024.png
          for f in "$ICONSET"/*.png; do
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            sips -z "$h" "$w" /tmp/icon-1024.png --out "$f"
          done

      - name: Write the App Store Connect API key
        env:
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPSTORE_API_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Archive (ad-hoc signed; real signing happens at export)
        # Automatic signing at ARCHIVE time demands a DEVELOPMENT profile,
        # which requires a registered device on the team, and this account
        # has none (build #2: "Your team has no devices"). App Store
        # DISTRIBUTION profiles need no devices, so the archive signs AD HOC
        # (identity "-", no profile needed) and the export step swaps in the
        # real cloud-managed signature. Ad hoc, NOT unsigned: an unsigned
        # archive (CODE_SIGNING_ALLOWED=NO, builds 1-14) embeds ZERO
        # entitlements, so the export re-sign had nothing to preserve and
        # build 14 shipped without com.apple.developer.applesignin, Apple
        # sign-in then died at runtime with ASAuthorizationError 1000. Ad-hoc
        # signing bakes the entitlements into the binary; export keeps them.
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Export the signed IPA
        run: |
          cat > build/export.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>TEAM_ID_PLACEHOLDER</string>
          </dict>
          </plist>
          EOF
          /usr/libexec/PlistBuddy -c "Set :teamID ${{ secrets.APPLE_TEAM_ID }}" build/export.plist
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/export.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }}
          ls -la build/ipa

      - name: Verify the applesignin entitlement survived signing
        # Build 14's only symptom was a runtime error 1000 on the phone. Fail
        # the build RIGHT HERE if the exported app lost the entitlement, so a
        # signing regression can never ride to TestFlight silently again.
        run: |
          IPA=$(ls build/ipa/*.ipa | head -1)
          unzip -q "$IPA" -d build/ipa/unpacked
          APP=$(ls -d build/ipa/unpacked/Payload/*.app | head -1)
          codesign -d --entitlements :- "$APP" | tee /tmp/ents.plist
          grep -q 'com.apple.developer.applesignin' /tmp/ents.plist

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          IPA=$(ls build/ipa/*.ipa | head -1)
          # fastlane's api_key JSON wants the .p8 CONTENTS in a `key` field
          # (build #4: "API key JSON is missing field(s): key"); python does the
          # JSON escaping of the key's newlines correctly.
          python3 -c "
          import json, os
          kid = os.environ['APPSTORE_KEY_ID']
          key = open(os.path.expanduser('~/private_keys/AuthKey_' + kid + '.p8')).read()
          json.dump({'key_id': kid, 'issuer_id': os.environ['APPSTORE_ISSUER_ID'], 'key': key, 'in_house': False}, open('build/asc_key.json', 'w'))
          "
          fastlane pilot upload \
            --ipa "$IPA" \
            --api_key_path build/asc_key.json \
            --skip_waiting_for_build_processing true
