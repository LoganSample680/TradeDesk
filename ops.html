<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>TradeDesk Ops</title>
<link rel="icon" href="favicon.ico">
<!-- Its own manifest and icon, deliberately not the app's. Added to a home
     screen this installs as a separate standalone icon called Ops, so the two
     never get confused on a phone, and opening it lands here rather than in
     the app's "/" gate. -->
<link rel="manifest" href="ops-manifest.json">
<meta name="theme-color" content="#7C3D0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ops">
<link rel="apple-touch-icon" href="icons/ops-192.png">
<!--
  ops.html: the internal ops portal. Two halves of one page.

  1. The NUMBERS: the ops_* reporting RPCs (20260919, 20260920), all gated by
     is_ops_admin(). This page starts with the account roll-up; the rest of the
     analytics layer lands here next to it.
  2. The SUPPORT VIEW, embedded (owner 2026-09-12: "I want it embedded in the ops
     portal"). Picking a person opens the REAL app in a frame at near full size,
     read only, with the person switcher and the exit in this page's chrome
     rather than inside the app. js/ops-view.js is what runs inside that frame.

  Read only is not this page's promise to keep: the database grants an ops admin
  SELECT and nothing else (20261005_ops_view_readonly.sql). This page cannot
  write a customer's data even if it tried, and it does not try.
-->
<script src="js/vendor/supabase-js-2.112.3.min.js"></script>
<style>
:root{
  --bg:#0F0D0B;--panel:#1A1613;--panel2:#221C17;--line:#2C2620;--line2:#3A322A;
  --text:#F5F1EA;--text2:#B9AFA1;--text3:#8A8073;
  --accent:#C2703C;--accent-deep:#7C3D0A;--ok:#4E9A5B;--warn:#D9705B;
  --bar:44px;
}
*{box-sizing:border-box}
/* .rows and .tiles set display, which beats the browser's own [hidden] rule, so
   a hidden section stayed on screen. Everything here hides when told to. */
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.brand-name{font-size:17px;font-weight:800;letter-spacing:-.3px}
.brand-sub{font-size:11px;color:var(--text3)}
.who{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--line2);background:transparent;color:var(--text);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:border-color .15s ease}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#1A1613}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.section-title{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);margin:22px 0 10px}
.muted{color:var(--text3);font-size:13px}
.warn{color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-width:0}
.tile-v{font-size:22px;font-weight:800;letter-spacing:-.6px}
.tile-k{font-size:11px;color:var(--text3);margin-top:2px}
.range{display:flex;gap:6px;flex-wrap:wrap}
.range button{border:1px solid var(--line2);background:transparent;color:var(--text2);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.range button.on{background:var(--accent);border-color:var(--accent);color:#1A1613}
.skel{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--panel) 0%,#231D18 50%,var(--panel) 100%);background-size:200% 100%;animation:sk 1.1s linear infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
form.signin{display:flex;flex-direction:column;gap:10px;max-width:340px}
form.signin input{background:#120F0D;border:1px solid var(--line2);color:var(--text);border-radius:9px;padding:11px 12px;font-size:14px}

/* ── Search and the list ────────────────────────────────────────────────────
   Built for four hundred businesses, not four: one search box over every
   business AND every person, a sort, and a list that renders a page at a time
   so the DOM never holds more rows than a screen can use. */
.searchbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
#q{flex:1;min-width:180px;background:#120F0D;border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:11px 13px;font-size:14px}
#q:focus{outline:none;border-color:var(--accent)}
#sort{background:#120F0D;border:1px solid var(--line2);color:var(--text2);border-radius:10px;padding:11px;font-size:13px}
.count{font-size:12px;color:var(--text3);margin-bottom:8px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:inherit;cursor:pointer;text-align:left;transition:border-color .15s ease,transform .15s cubic-bezier(.22,1,.36,1)}
.row:hover{border-color:var(--accent)}
.row:active{transform:scale(.995)}
.row-main{flex:1;min-width:0}
.row-name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:11px;color:var(--text3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-stat{font-size:12px;color:var(--text2);flex-shrink:0;text-align:right}
.row-stat b{display:block;font-size:14px;color:var(--text);font-weight:800}
.chev{color:var(--text3);flex-shrink:0;font-weight:800}
.kind{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);flex-shrink:0}
#more{width:100%;margin-top:10px;padding:12px;border:1px dashed var(--line2);border-radius:11px;background:transparent;color:var(--text2);font-size:13px;font-weight:700;cursor:pointer}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--text2);font-size:13px;font-weight:700;cursor:pointer;padding:0;margin-bottom:12px}
.back:hover{color:var(--accent)}
.biz-title{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:2px}

/* ── The embedded support view ───────────────────────────────────────────── */
#view{position:fixed;inset:0;z-index:9000;background:var(--bg);display:none;flex-direction:column}
#view.on{display:flex}
#view-bar{height:calc(var(--bar) + env(safe-area-inset-top,0px));padding:0 10px;padding-top:env(safe-area-inset-top,0px);background:var(--accent-deep);color:#fff;display:flex;align-items:center;gap:8px;flex-shrink:0}
#view-who{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;font-weight:700}
.tag{background:rgba(255,255,255,.18);border-radius:5px;padding:2px 7px;font-size:10px;font-weight:800;letter-spacing:.4px;flex-shrink:0}
#view-people{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-left:auto;padding-left:8px}
#view-people::-webkit-scrollbar{display:none}
#view-people button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:5px 11px;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer}
#view-people button.on{background:#fff;color:var(--accent-deep)}
#view-exit{border:0;background:#fff;color:var(--accent-deep);border-radius:8px;padding:6px 13px;font-size:12px;font-weight:800;cursor:pointer;flex-shrink:0}
#view-frame{flex:1;width:100%;border:0;background:#fff}
#view-note{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;color:var(--text2)}
@media(max-width:640px){
  #view-who .biz-part{display:none}
  #view-people{order:3;width:100%;margin:0;padding:0 0 6px}
  #view-bar{flex-wrap:wrap;height:auto;padding-bottom:0}
}
</style>
</head>
<body>

<div class="wrap" id="page">
  <header class="top">
    <div class="brand">
      <div class="brand-mark">🛠</div>
      <div>
        <div class="brand-name">TradeDesk Ops</div>
        <div class="brand-sub">Internal. Read only.</div>
      </div>
    </div>
    <div class="who"><span id="who-txt"></span><button class="btn" id="signout" hidden>Sign out</button></div>
  </header>

  <div id="gate" hidden>
    <div class="card">
      <div style="font-size:16px;font-weight:800;margin-bottom:4px">Sign in</div>
      <div class="muted" style="margin-bottom:12px">Use the account on the ops allowlist.</div>
      <form class="signin" id="signin-form">
        <input type="email" id="email" placeholder="Email" autocomplete="username" required>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
        <button class="btn btn-primary" type="submit">Sign in</button>
        <div class="muted" id="signin-err" style="color:#D9705B"></div>
      </form>
    </div>
  </div>

  <div id="denied" hidden>
    <div class="card">
      <div id="denied-title" style="font-size:16px;font-weight:800;margin-bottom:4px">Not authorized</div>
      <div id="denied-body" class="muted">This login is not on the ops allowlist, so there is nothing to show. Every ops function returns empty for anyone else.</div>
    </div>
  </div>

  <main id="main" hidden>
    <!-- LEVEL 1: the trades. Search still reaches every business and person, so
         the hierarchy never gets in the way of knowing where you want to go. -->
    <section id="lvl-all">
      <div class="section-title" style="margin-top:6px">Activity</div>
      <div class="range" id="range" style="margin-bottom:10px">
        <button data-days="7">7 days</button>
        <button data-days="30" class="on">30 days</button>
        <button data-days="90">90 days</button>
      </div>
      <div class="tiles" id="tiles"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>

      <div class="section-title">Trades</div>
      <div class="searchbar">
        <input id="q" type="search" placeholder="Search a business or a person" autocomplete="off" spellcheck="false">
      </div>
      <div class="count" id="count"></div>
      <div class="rows" id="trades"></div>
      <div class="rows" id="results" hidden></div>
      <button id="more" hidden>Show more</button>
    </section>

    <!-- LEVEL 2: the businesses in one trade, ordered by how hard they use it. -->
    <section id="lvl-trade" hidden>
      <button class="back" id="trade-back">‹ All trades</button>
      <div class="biz-title" id="trade-name"></div>
      <div class="muted" id="trade-sub" style="margin-bottom:12px"></div>
      <div class="searchbar">
        <select id="sort" aria-label="Sort">
          <option value="active-desc">Most active first</option>
          <option value="active-asc">Least active first</option>
          <option value="miles-desc">Most miles</option>
          <option value="name">Name</option>
        </select>
      </div>
      <div class="rows" id="trade-biz"></div>
      <button id="trade-more" hidden>Show more</button>
    </section>

    <!-- LEVEL 3: one business. Its numbers for the range, then its people. -->
    <section id="lvl-biz" hidden>
      <button class="back" id="biz-back">‹ Back</button>
      <div class="biz-title" id="biz-name"></div>
      <div class="muted" id="biz-sub" style="margin-bottom:14px"></div>
      <div class="tiles" id="biz-tiles"></div>
      <div class="section-title">People</div>
      <div class="rows" id="biz-people"></div>
    </section>
  </main>
</div>

<!-- The support view. The app itself, in a frame, under one bar of chrome. -->
<div id="view" aria-hidden="true">
  <div id="view-bar">
    <span class="tag">READ ONLY</span>
    <span id="view-who"></span>
    <span id="view-people"></span>
    <button id="view-exit">Exit</button>
  </div>
  <iframe id="view-frame" title="Support view" referrerpolicy="same-origin"></iframe>
  <div id="view-note" hidden></div>
</div>

<script>
const SUPA_URL='https://mwtsmctajhrrybblgorf.supabase.co';
const SUPA_KEY='sb_publishable_kaahEa5tFydocUuYi8plHg_K78HPyvJ';
// Same storage key as the app, so a session already signed in on this origin is
// the session this page uses. The frame below boots into that same session.
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAGE=40;                       // rows rendered at a time

// ── The support view is CLOSED (owner, 2026-09-12) ─────────────────────────
// Opening an account showed the owner's own on-site card and timesheet stitched
// into that account's screens: the frame boots the viewer's session first and
// only then swaps data in, so this device's caches and live geo state render
// under somebody else's name. Nothing was ever written to the account being
// looked at (the database grants an ops admin SELECT and nothing else, and the
// row counts confirmed it), but a view you cannot trust is worse than no view.
// The numbers and the roster stay open; opening a person is refused until the
// frame boots AS the target instead of as the viewer.
// __opsForceView is the test hook, and the only way past this.
const VIEW_OPEN=(typeof window.__opsForceView!=='undefined')?!!window.__opsForceView:false;

// Numbers arrive from Postgres as strings or floats depending on the column, and
// a raw float renders as 993.5999999999999. One formatter, used everywhere a
// number reaches the page: at most one decimal, thousands separated.
function num(v){
  if(v==null||v==='')return null;
  const n=Number(v);
  if(!isFinite(n))return String(v);
  return n.toLocaleString('en-US',{maximumFractionDigits:1});
}

let PEOPLE=[];                       // one row per person, straight from the roster
let BIZ=[];                          // one row per business
let TRADES=[];                       // one row per trade, built from BIZ
let STATS=new Map();                 // contractor_user_id -> ops_by_contractor row
let DAYS=30, QUERY='', SORT='active-desc';
let SHOWN=PAGE, TSHOWN=PAGE;
let TRADE=null, OPEN=null;           // the trade and the business being looked at

/* ── Boot ─────────────────────────────────────────────────────────────────── */
(async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('gate').hidden=false; return; }
  $('who-txt').textContent=session.user.email||'';
  $('signout').hidden=false;
  await load();
})();

$('signin-form').addEventListener('submit',async e=>{
  e.preventDefault();
  $('signin-err').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  if(error){ $('signin-err').textContent=error.message; return; }
  location.reload();
});
$('signout').addEventListener('click',async()=>{ await sb.auth.signOut(); location.reload(); });

async function load(){
  const {data,error}=await sb.rpc('ops_view_roster');
  // An ERROR and an EMPTY roster are different answers and used to render the
  // same denial card, which sent you hunting for a permissions problem when the
  // network was at fault. Error says so; empty means not on the ops allowlist.
  if(error){
    $('denied').hidden=false;
    $('denied-title').textContent='Could not load';
    $('denied-body').innerHTML='The roster call failed: '+esc(error.message)+
      '. That is a connection or server problem, not a permissions one. '+
      '<button class="btn" id="retry" style="margin-top:10px;display:block">Try again</button>';
    $('retry').addEventListener('click',()=>location.reload());
    return;
  }
  if(!Array.isArray(data)||!data.length){ $('denied').hidden=false; return; }
  PEOPLE=data;
  $('main').hidden=false;
  build();
  renderTrades();
  refreshStats();
}

// Businesses from the people roster, then trades from the businesses. The trade
// is whatever the contractor picked in settings (account_config.business_type),
// carried on every roster row.
function build(){
  const m=new Map();
  PEOPLE.forEach(p=>{
    let b=m.get(p.contractor_user_id);
    if(!b){ b={id:p.contractor_user_id,name:p.business||'Unknown',trade:p.trade||'unknown',lines:p.trade_lines||'',people:[]}; m.set(p.contractor_user_id,b); }
    b.people.push(p);
  });
  BIZ=[...m.values()];
  const t=new Map();
  BIZ.forEach(b=>{
    let e=t.get(b.trade);
    if(!e){ e={trade:b.trade,biz:[],people:0}; t.set(b.trade,e); }
    e.biz.push(b); e.people+=b.people.length;
  });
  TRADES=[...t.values()].sort((x,y)=>y.biz.length-x.biz.length||x.trade.localeCompare(y.trade));
}

// Title case, except the trades that are acronyms and read wrong that way.
const TRADE_CAPS={hvac:'HVAC',gc:'GC',ac:'AC'};
const TRADE_LABEL=t=>{
  if(!t||t==='unknown')return 'Not set';
  return t.replace(/[-_]/g,' ').split(' ')
    .map(w=>TRADE_CAPS[w.toLowerCase()]||w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
};

/* ── Range and numbers ────────────────────────────────────────────────────── */
$('range').addEventListener('click',e=>{
  const b=e.target.closest('button[data-days]');
  if(!b)return;
  DAYS=+b.dataset.days;
  [...$('range').children].forEach(c=>c.classList.toggle('on',c===b));
  refreshStats();
});

function rangeIso(){
  const iso=d=>d.toISOString().slice(0,10);
  return {from:iso(new Date(Date.now()-(DAYS-1)*86400000)),to:iso(new Date())};
}

async function renderTiles(){
  const {from,to}=rangeIso();
  const {data,error}=await sb.rpc('ops_summary',{p_from:from,p_to:to});
  const r=Array.isArray(data)?data[0]:data;
  if(error){ $('tiles').innerHTML=tile('—','Could not load activity'); return; }
  if(!r||!r.people){ $('tiles').innerHTML=tile('0','Nothing happened in this range'); return; }
  $('tiles').innerHTML=[
    tile(r.people,'People active'),
    tile(r.accounts,'Businesses'),
    tile(r.active_days,'Days the app was opened'),
    tile(r.days_clocked,'Days clocked'),
    tile(r.avg_day_min!=null?Math.round(r.avg_day_min/60*10)/10+'h':'—','Average day'),
    tile(r.total_miles,'Miles'),
    tile(r.avg_visit_min!=null?Math.round(r.avg_visit_min)+'m':'—','Average visit'),
    tile(r.unnamed_legs,'Unnamed drives')
  ].join('');
}
const tile=(v,k)=>`<div class="tile"><div class="tile-v">${v==null?'—':esc(typeof v==='number'||/^[\d.]+$/.test(String(v))?num(v):v)}</div><div class="tile-k">${esc(k)}</div></div>`;

// Per-business activity for the range: the sort key for "top user to least",
// and each row's number.
async function refreshStats(){
  const {from,to}=rangeIso();
  renderTiles();
  const {data,error}=await sb.rpc('ops_by_contractor',{p_from:from,p_to:to});
  if(!error&&Array.isArray(data))STATS=new Map(data.map(r=>[r.contractor_user_id,r]));
  renderTrades();
  if(TRADE)renderTrade(TRADE);
  if(OPEN)renderBiz(OPEN);
}
const use=b=>{ const s=STATS.get(b.id)||{}; return Number(s.active_days||0); };

/* ── Level 1: trades, or search results ───────────────────────────────────── */
$('q').addEventListener('input',e=>{ QUERY=e.target.value.trim().toLowerCase(); SHOWN=PAGE; renderTrades(); });
$('more').addEventListener('click',()=>{ SHOWN+=PAGE; renderTrades(); });
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('q')&&!$('view').classList.contains('on')){ e.preventDefault(); $('q').focus(); }
});

function renderTrades(){
  if(QUERY)return renderResults();
  $('results').hidden=true; $('trades').hidden=false; $('more').hidden=true;
  $('count').textContent=`${TRADES.length} ${TRADES.length===1?'trade':'trades'}, ${BIZ.length} businesses, ${PEOPLE.length} people`;
  $('trades').innerHTML=TRADES.map(t=>{
    const active=t.biz.filter(b=>use(b)>0).length;
    return `<button class="row" data-trade="${esc(t.trade)}">
      <span class="row-main">
        <span class="row-name">${esc(TRADE_LABEL(t.trade))}</span>
        <span class="row-sub">${t.people} ${t.people===1?'person':'people'}${active?' · '+active+' active in range':' · none active in range'}</span>
      </span>
      <span class="row-stat"><b>${t.biz.length}</b>${t.biz.length===1?'business':'businesses'}</span>
      <span class="chev">›</span>
    </button>`;
  }).join('');
}

// Search never stops at the trade level: a business name matches the business,
// a person name or email matches the person, tagged with where they work.
function renderResults(){
  $('trades').hidden=true; $('results').hidden=false;
  const rows=[];
  BIZ.forEach(b=>{ if(b.name.toLowerCase().includes(QUERY))rows.push({kind:'biz',biz:b}); });
  const hit=new Set(rows.map(r=>r.biz.id));
  PEOPLE.forEach(p=>{
    const hay=((p.person_name||'')+' '+(p.person_email||'')).toLowerCase();
    if(hay.includes(QUERY)&&!hit.has(p.contractor_user_id))rows.push({kind:'person',person:p});
  });
  const page=rows.slice(0,SHOWN);
  $('count').textContent=`${rows.length} ${rows.length===1?'match':'matches'} for "${QUERY}"`;
  $('results').innerHTML=page.map(r=>r.kind==='biz'?bizRow(r.biz,true):personRow(r.person)).join('')
    || `<div class="card muted">Nothing matches "${esc(QUERY)}".</div>`;
  $('more').hidden=rows.length<=SHOWN;
  $('more').textContent=`Show ${Math.min(PAGE,rows.length-SHOWN)} more of ${rows.length}`;
}

function bizRow(b,withTrade){
  const s=STATS.get(b.id)||{};
  const crew=b.people.filter(p=>p.role!=='owner').length;
  const bits=[`${b.people.length} ${b.people.length===1?'person':'people'}${crew?' · '+crew+' crew':''}`,
              s.last_active?relDay(s.last_active):'no activity'];
  if(withTrade)bits.unshift(TRADE_LABEL(b.trade));
  return `<button class="row" data-biz="${esc(b.id)}">
    <span class="row-main">
      <span class="row-name">${esc(b.name)}</span>
      <span class="row-sub">${esc(bits.join(' · '))}</span>
    </span>
    <span class="row-stat"><b>${s.active_days!=null?esc(num(s.active_days)):'0'}</b>days used</span>
    <span class="chev">›</span>
  </button>`;
}

function personRow(p){
  return `<button class="row" data-biz="${esc(p.contractor_user_id)}" data-person="${esc(p.person_user_id)}">
    <span class="kind">Person</span>
    <span class="row-main">
      <span class="row-name">${esc(p.person_name||p.person_email||'Unknown')}</span>
      <span class="row-sub">${esc(p.role==='owner'?'Owner':(p.role||'crew'))} · ${esc(p.business)}</span>
    </span>
    <span class="chev">›</span>
  </button>`;
}

function relDay(d){
  const days=Math.round((Date.now()-Date.parse(d+'T12:00:00Z'))/86400000);
  if(days<=0)return 'active today';
  if(days===1)return 'active yesterday';
  if(days<14)return 'active '+days+' days ago';
  return 'last active '+d;
}

$('trades').addEventListener('click',e=>{
  const el=e.target.closest('[data-trade]');
  if(el)openTrade(TRADES.find(t=>t.trade===el.dataset.trade));
});
$('results').addEventListener('click',e=>{
  const el=e.target.closest('[data-biz]');
  if(!el)return;
  if(el.dataset.person){
    const p=PEOPLE.find(x=>x.person_user_id===el.dataset.person&&x.contractor_user_id===el.dataset.biz);
    if(p)openView(p);
    return;
  }
  const b=BIZ.find(x=>x.id===el.dataset.biz);
  if(b)openBiz(b);
});

/* ── Level 2: the businesses in one trade ─────────────────────────────────── */
function openTrade(t){
  if(!t)return;
  TRADE=t; TSHOWN=PAGE;
  show('lvl-trade');
  renderTrade(t);
}
$('trade-back').addEventListener('click',()=>{ TRADE=null; show('lvl-all'); });
$('sort').addEventListener('change',e=>{ SORT=e.target.value; if(TRADE)renderTrade(TRADE); });
$('trade-more').addEventListener('click',()=>{ TSHOWN+=PAGE; if(TRADE)renderTrade(TRADE); });

function renderTrade(t){
  const s=b=>STATS.get(b.id)||{};
  const sorted=[...t.biz].sort({
    'active-desc':(a,b)=>use(b)-use(a)||a.name.localeCompare(b.name),
    'active-asc':(a,b)=>use(a)-use(b)||a.name.localeCompare(b.name),
    'miles-desc':(a,b)=>Number(s(b).total_miles||0)-Number(s(a).total_miles||0),
    'name':(a,b)=>a.name.localeCompare(b.name)
  }[SORT]);
  const page=sorted.slice(0,TSHOWN);
  $('trade-name').textContent=TRADE_LABEL(t.trade);
  $('trade-sub').textContent=`${t.biz.length} ${t.biz.length===1?'business':'businesses'} · ${t.people} people · ${t.biz.filter(b=>use(b)>0).length} active in this range`;
  $('trade-biz').innerHTML=page.map(b=>bizRow(b,false)).join('');
  $('trade-more').hidden=sorted.length<=TSHOWN;
  $('trade-more').textContent=`Show ${Math.min(PAGE,sorted.length-TSHOWN)} more of ${sorted.length}`;
}

$('trade-biz').addEventListener('click',e=>{
  const el=e.target.closest('[data-biz]');
  if(!el)return;
  const b=BIZ.find(x=>x.id===el.dataset.biz);
  if(b)openBiz(b);
});

/* ── Level 3: one business ────────────────────────────────────────────────── */
function show(id){
  ['lvl-all','lvl-trade','lvl-biz'].forEach(l=>{ $(l).hidden=(l!==id); });
  window.scrollTo({top:0,behavior:'instant'});
}

function openBiz(b){
  OPEN=b;
  show('lvl-biz');
  renderBiz(b);
}
$('biz-back').addEventListener('click',()=>{
  OPEN=null;
  // Back goes where you came from: the trade if you drilled through it, the
  // top level if you arrived from a search.
  show(TRADE?'lvl-trade':'lvl-all');
});

function renderBiz(b){
  const s=STATS.get(b.id)||{};
  const owner=b.people.find(p=>p.role==='owner');
  $('biz-name').textContent=b.name;
  $('biz-sub').textContent=[TRADE_LABEL(b.trade)+(b.lines&&b.lines!==b.trade?' ('+b.lines+')':''),
                            owner&&owner.person_email,
                            s.last_active?relDay(s.last_active):'no activity in this range'].filter(Boolean).join(' · ');
  $('biz-tiles').innerHTML=[
    tile(s.people,'People'),
    tile(s.active_days,'Days opened'),
    tile(s.days_clocked,'Days clocked'),
    tile(s.avg_day_min!=null?Math.round(s.avg_day_min/60*10)/10+'h':'—','Average day'),
    tile(s.total_miles,'Miles'),
    tile(s.visits,'Visits'),
    tile(s.avg_visit_min!=null?Math.round(s.avg_visit_min)+'m':'—','Average visit'),
    tile(s.unnamed_legs,'Unnamed drives')
  ].join('');
  $('biz-people').innerHTML=b.people.map(p=>`<button class="row" data-person="${esc(p.person_user_id)}">
    <span class="row-main">
      <span class="row-name">${esc(p.person_name||p.person_email||'Unknown')}</span>
      <span class="row-sub">${esc(p.role==='owner'?'Owner':(p.role||'crew'))}${p.active===false?' · inactive':''}</span>
    </span>
    <span class="row-stat">Open ›</span>
  </button>`).join('');
}

$('biz-people').addEventListener('click',e=>{
  const el=e.target.closest('[data-person]');
  if(!el||!OPEN)return;
  const p=OPEN.people.find(x=>x.person_user_id===el.dataset.person);
  if(p)openView(p);
});

/* ── The support view ─────────────────────────────────────────────────────── */
let VIEW=null;

function openView(row){
  if(!VIEW_OPEN){
    $('view-note').hidden=false;
    $('view-note').textContent='';
    $('view').classList.add('on');
    $('view').setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
    VIEW=row;
    paintBar();
    $('view-frame').removeAttribute('src');
    $('view-note').hidden=false;
    $('view-note').innerHTML='<div style="max-width:420px;text-align:center;line-height:1.6">'+
      '<div style="font-size:15px;font-weight:800;color:var(--text);margin-bottom:6px">Support view is closed</div>'+
      'It was showing your own on-site card and timesheet inside somebody else\'s account. '+
      'Nothing was written to their data. It reopens once the frame boots as them rather than as you.</div>';
    return;
  }
  VIEW=row;
  $('view-frame').src='index.html?ops=1&t='+encodeURIComponent(row.contractor_user_id)+'&p='+encodeURIComponent(row.person_user_id);
  $('view').classList.add('on');
  $('view').setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  paintBar();
}

function paintBar(){
  if(!VIEW)return;
  $('view-who').innerHTML=`${esc(VIEW.person_name||VIEW.person_email||'Unknown')}<span class="biz-part"> · ${esc(VIEW.business)}</span>`;
  const people=PEOPLE.filter(r=>r.contractor_user_id===VIEW.contractor_user_id);
  // One chip per person on this account: switching inside a business costs no
  // reload, the frame already holds its rows.
  $('view-people').innerHTML=people.map(p=>`<button data-pid="${esc(p.person_user_id)}" class="${p.person_user_id===VIEW.person_user_id?'on':''}">${esc((p.person_name||p.person_email||'?').split(' ')[0])}</button>`).join('');
}

$('view-people').addEventListener('click',e=>{
  const b=e.target.closest('button[data-pid]');
  if(!b||!VIEW)return;
  const row=PEOPLE.find(r=>r.contractor_user_id===VIEW.contractor_user_id&&r.person_user_id===b.dataset.pid);
  if(!row)return;
  VIEW=row;
  paintBar();
  $('view-frame').contentWindow.postMessage({source:'td-ops-portal',type:'switch',contractor_user_id:row.contractor_user_id,person_user_id:row.person_user_id},location.origin);
});

$('view-exit').addEventListener('click',closeView);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('view').classList.contains('on'))closeView(); });

function closeView(){
  // Tell the frame to clear what it cached of theirs, then drop the frame.
  // Dropping it IS the reset: nothing of that account survives it.
  try{ $('view-frame').contentWindow.postMessage({source:'td-ops-portal',type:'exit'},location.origin); }catch(_e){}
  setTimeout(()=>{ $('view-frame').src='about:blank'; },60);
  $('view').classList.remove('on');
  $('view').setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  VIEW=null;
}

window.addEventListener('message',ev=>{
  if(ev.origin!==location.origin)return;
  const d=ev.data;
  if(!d||d.source!=='td-ops-view')return;
  if(d.type==='denied'){ $('view-note').hidden=false; $('view-note').textContent='That session is not on the ops allowlist.'; }
  if(d.type==='not-found'){ $('view-note').hidden=false; $('view-note').textContent='That account is no longer in the roster.'; }
  if(d.type==='entered'){ $('view-note').hidden=true; }
});
</script>
