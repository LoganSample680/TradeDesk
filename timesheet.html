<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Timesheet</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<!-- The public timesheet page (owner 2026-09-05). Opened from the link in a
     submitted timesheet text. Anon, no app, no login. The week bars and the
     day rail are drawn by the app's own js/timelog.js against the rows one
     RPC returns for this token, so the boss sees exactly what the person saw.
     Reject is soft grey, Approve is the one dark button. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/timelog.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#2D5DA8;--blue-dk:#1B3F7A;--blue-lt:#DCE8FA;--denim:#2D5DA8;--denim-soft:#DCE8FA;
  --amber:#8A4E00;--amber-lt:#FBE2BB;
  --bg:#F4F5F7;--bg2:#FFFFFF;--bg3:#ECEEF2;--bg-card:#FFFFFF;--cream:#ECEEF2;--paper:#F4F5F7;
  --text:#161A1F;--text2:#4B5563;--text3:#636C7B;--text-2:#4B5563;--text-3:#636C7B;
  --border:#E2E5EB;--border2:#CFD4DC;--line:#E2E5EB;--line-2:#CFD4DC;
  --ink:#1B1612;--ink-soft:#3A3128;
  --c-green:#117841;--c-green-deep:#0B5430;--c-green-soft:#D4ECDC;
  --c-amber:#9F5B00;--c-amber-deep:#704000;--c-amber-soft:#FBE2BB;
  --c-red:#B22A20;--c-red-deep:#7E1B14;--c-red-soft:#FAD6CF;
  --c-teal:#0E6B6B;
  --r:8px;--rl:12px;--r-xs:4px;--r-sm:6px;--r-md:10px;--r-lg:12px;--r-xl:16px;--r-pill:999px;
  --shadow-card:0 1px 2px rgba(27,22,18,.04),0 0 0 1px var(--line);
  --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
button{font-family:inherit}
.tsp-wrap{max-width:520px;margin:0 auto;padding:0 16px 32px}
.tsp-biz{height:52px;margin:0 -16px 12px;background:var(--bg-card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15px;font-weight:800}
.tsp-biz::before{content:'';width:28px;height:28px;border-radius:7px;background:var(--blue);flex-shrink:0}
.tsp-title{display:flex;align-items:flex-end;gap:10px;padding:2px 0 6px}
.tsp-who{flex:1;min-width:0}
.tsp-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.tsp-name{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:1px}
.tsp-range{font-size:13px;color:var(--text2);margin-top:2px}
.tsp-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:7px;padding:4px 8px;white-space:nowrap}
.tsp-chip.ok{color:var(--c-green-deep);background:var(--c-green-soft)}
.tsp-chip.back{color:var(--amber);background:var(--amber-lt)}
/* One week is the whole page: no month above it, no stepping out of it. */
.tsp-week .tl-drill-back,.tsp-week .tl-monav-btn{visibility:hidden}
.tsp-empty{padding:40px 0;text-align:center;color:var(--text3);font-size:13px}
.tsp-foot{display:flex;flex-direction:column;gap:8px;padding:8px 0 0}
.tsp-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:13px;font-size:15px;font-weight:800;border:none;cursor:pointer;width:100%}
.tsp-btn.dark{background:var(--ink);color:#fff}
.tsp-btn.grey{background:#E9EBEF;color:var(--text2);height:46px;font-size:14.5px;font-weight:700}
.tsp-btn[disabled]{opacity:.5;cursor:default}
.tsp-reject-box{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--bg-card);box-shadow:var(--shadow-card)}
.tsp-label{font-size:13px;font-weight:800}
.tsp-note{width:100%;border:1.5px solid var(--line-2);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical;min-height:56px;background:#fff;color:var(--text)}
.tsp-row{display:flex;gap:8px}
.tsp-row .tsp-btn{height:44px;font-size:14px}
.tsp-done{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px;border-radius:13px;font-size:14.5px;font-weight:800;text-align:center}
.tsp-done.ok{background:var(--c-green-soft);color:var(--c-green-deep)}
.tsp-done.back{background:var(--amber-lt);color:var(--amber)}
.tsp-done-note{font-size:13px;font-weight:600;color:var(--text2)}
.tsp-fine{font-size:11.5px;color:var(--text3);text-align:center}
.tsp-err{font-size:12.5px;color:var(--c-red);text-align:center;font-weight:700}
.tsp-state{max-width:420px;margin:80px auto 0;padding:0 24px;text-align:center}
.tsp-state-t{font-size:20px;font-weight:800}
.tsp-state-m{font-size:14px;color:var(--text2);margin-top:6px}
.tsp-ft{text-align:center;font-size:11px;color:var(--text3);margin-top:22px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="tsp-state" class="tsp-state" hidden></div>
<div id="tsp-page" class="tsp-wrap" hidden>
  <div id="tsp-head"></div>
  <div id="tsp-body" class="tsp-body tsp-week"></div>
  <div id="tsp-err" class="tsp-err" hidden></div>
  <div id="tsp-foot" class="tsp-foot"></div>
  <div class="tsp-ft">Sent with TradeDesk</div>
</div>
<script src="js/icons.js"></script>
<script src="js/utils.js"></script>
<script src="js/timelog.js"></script>
<script src="js/timesheet-public.js"></script>
</body>
</html>
