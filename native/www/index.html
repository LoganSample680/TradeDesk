<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TradeDesk</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
         font-family:-apple-system,system-ui,sans-serif;background:#1B1612;color:#fff;text-align:center}
    .p{padding:24px}
    h1{font-size:20px;margin:0 0 8px}
    p{font-size:14px;color:#c8c2bb;margin:0 0 20px}
    button{font:inherit;font-size:15px;font-weight:600;color:#1B1612;background:#fff;border:0;
           border-radius:12px;padding:12px 28px}
  </style>
</head>
<body>
  <!-- server.errorPath (capacitor.config.json): shown only when the live app
       cannot load AND the service worker has nothing cached yet, i.e. the very
       first launch with no connection. After one online launch the app opens
       offline from its own cache. -->
  <div class="p">
    <h1>TradeDesk</h1>
    <p>No connection. Open TradeDesk once with signal and it will work offline after that.</p>
    <button onclick="location.href='https://uat.tradedesk-cyp.pages.dev/'">Try again</button>
  </div>
</body>
</html>
